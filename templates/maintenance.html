<!DOCTYPE html>
{% load static %}
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titre }} — site en maintenance</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="{% static 'image/favicon.png' %}" type="image/png">
    <link rel="stylesheet" href="{% static 'css/polices.css' %}">
    <style>
        :root {
            --primary-color: #E81C24;
            --font-heading: 'Amiri', serif;
            --font-body: 'Noto Sans', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-body);
            background: #f1f1f1;
            color: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .container {
            text-align: center;
            max-width: 600px;
        }
        .code {
            font-family: var(--font-heading);
            font-size:.875rem;
            line-height: 1;
            color: var(--primary-color);
            font-weight: 700;
        }
        h1 {
            font-family: var(--font-heading);
            font-size: 2rem;
            margin: 1rem 0 0.5rem;
        }
        p {
            color: #6c6c6c;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background: var(--primary-color);
            color: #fff;
            padding: 0.6rem 1.5rem;
            text-decoration: none;
            font-weight: 600;
            border-radius: 3px;
            margin: 0.25rem;
            transition: background 0.2s;
        }
        .btn:hover { background: #c01018; }
        .btn-secondary {
            background: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
        }
        .btn-secondary:hover { background: var(--primary-color); color: #fff; }
        .divider {
            border: none;
            border-top: 3px solid var(--primary-color);
            width: 60px;
            margin: 1.5rem auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">{{ titre }}</div>
        <hr class="divider">
        <h1>Site en maintenance</h1>
        <p>Nous revenons bientôt.<br>En attendant, retrouvez l'actualité de la CNT-SO sur le site de la confédération.</p>
        <a href="{{ accueil }}" class="btn">Site de la CNT-SO</a>
    </div>
</body>
</html>
